<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Securox Reveal</title>
<style>
:root{--bg:#000;--cy:#6ee7f5;--dim:#3a8f99;--gr:#3dff8f;--rd:#ff4d5e;--wh:#eaf6f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--cy);overflow:hidden;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;opacity:.35}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
#win{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,92vw);border:1px solid var(--dim);background:rgba(0,8,10,.86);box-shadow:0 0 40px rgba(110,231,245,.18);transition:opacity .5s,transform .5s;opacity:0}
.started #win{opacity:1}
#win.gone{opacity:0;transform:translate(-50%,-50%) scale(.96);pointer-events:none}
#bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--dim);font-size:clamp(11px,1.3vw,14px);color:var(--dim)}
#bar i{width:10px;height:10px;border-radius:50%;background:var(--dim);display:inline-block}
#term{padding:18px 20px;height:min(58vh,520px);overflow:hidden;font-size:clamp(13px,1.9vw,20px);line-height:1.6;display:flex;flex-direction:column;justify-content:flex-end}
.ln{white-space:pre-wrap;word-break:break-all}
.ln.dim{color:var(--dim)}.ln.red{color:var(--rd);text-shadow:0 0 10px var(--rd)}
.ln.grant{color:var(--gr);text-shadow:0 0 18px var(--gr);font-size:1.7em;font-weight:700;letter-spacing:.08em;margin:.3em 0}
.ln.cur::after{content:"█";margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#win.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translate(-50%,-50%)}20%{transform:translate(-51%,-50%)}40%{transform:translate(-49%,-50%)}60%{transform:translate(-51%,-49.5%)}80%{transform:translate(-49.5%,-50%)}}
#win.flashred{box-shadow:0 0 60px rgba(255,77,94,.55);border-color:var(--rd)}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;pointer-events:none;overflow:hidden}
#logo{width:min(82vw,960px);opacity:0;display:block}
#tag{font-size:clamp(11px,1.7vw,20px);letter-spacing:.42em;color:var(--dim);opacity:0;text-indent:.42em;text-align:center}
#stage.show #logo{animation:rev 1.5s steps(1,end) forwards,glow 3.2s 1.5s ease-in-out infinite}
#stage.show #tag{animation:fin 1.6s 1.6s forwards}
#stage.show::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--cy);box-shadow:0 0 30px 8px var(--cy);animation:scan 1.3s ease-in forwards}
@keyframes rev{0%{opacity:0;filter:blur(20px);transform:scale(1.1)}12%{opacity:1;filter:blur(9px) hue-rotate(70deg);transform:translate(-14px,0) skewX(7deg)}24%{filter:blur(2px) hue-rotate(-50deg);transform:translate(16px,3px)}36%{filter:blur(5px);transform:translate(-6px,-3px) skewX(-5deg)}48%{filter:none;transform:translate(4px,0)}60%{filter:hue-rotate(90deg);transform:translate(-8px,0) skewX(3deg)}72%{filter:none;transform:none}82%{opacity:.4;transform:translate(6px,0)}100%{opacity:1;filter:none;transform:none}}
@keyframes glow{0%,100%{opacity:1;filter:drop-shadow(0 0 6px rgba(110,231,245,.25))}50%{opacity:1;filter:drop-shadow(0 0 26px rgba(110,231,245,.6))}}
@keyframes fin{to{opacity:1}}
@keyframes scan{from{top:-4%}to{top:104%}}
#flash{position:fixed;inset:0;background:#dffcff;opacity:0;pointer-events:none}
#flash.go{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#stage.show #logo{animation:none;opacity:1}#stage.show::after{display:none}}
</style>
</head>

<script>
const $=s=>document.querySelector(s),term=$('#term'),win=$('#win'),stage=$('#stage'),flash=$('#flash');

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function type(t,c='',sp=34){const d=line(c);for(const ch of t){d.textContent+=ch;if(ch!==' ')tone(1100+Math.random()*500,.02,'square',.012);await sleep(sp)}return d}
async function bar(label,ms){const d=line(),n=26;for(let i=0;i<=n;i++){d.textContent=label+' ['+'█'.repeat(i)+'░'.repeat(n-i)+'] '+Math.round(i/n*100)+'%';tone(260+i*28,.03,'sawtooth',.018);await sleep(ms/n)}}
async function crack(){const d=line('dim'),T='SECUROX',S='ABCDEF0123456789#$%&*';for(let i=0;i<=T.length;i++){for(let k=0;k<7;k++){let s=T.slice(0,i);for(let j=i;j<T.length;j++)s+=S[Math.random()*S.length|0];d.textContent='key  '+s;tone(450+Math.random()*600,.02,'square',.014);await sleep(45)}}d.textContent='key  '+T+'  matched'}

async function run(){if(busy)return;busy=true;ac=ac||new(window.AudioContext||window.webkitAudioContext)();

addEventListener('click',()=>{if(!document.body.classList.contains('started'))run()});

const cv=$('#rain'),cx=cv.getContext('2d');let cols,drops;

fit();addEventListener('resize',fit);

drops.forEach((y,i)=>{cx.fillText(Math.random()<.5?'0':'1',i*18,y*18);drops[i]=y*18>cv.height&&Math.random()>.975?0:y+1})},60);
